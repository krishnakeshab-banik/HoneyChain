services:
  - type: web
    name: honeychain
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt && curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz | tar -xJ && export PATH="$PWD/node-v20.18.1-linux-x64/bin:$PATH" && cd web && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HONEYCHAIN_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
